name: Application smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import application and verify critical routes
        env:
          DIP_OUTPUT_DIR: /tmp/dip-ci-output
        run: |
          python - <<'PY'
          from backend.main import app
          paths = {route.path for route in app.routes}
          required = {
              "/", "/login", "/signin", "/offline.html", "/404.html",
              "/service-worker.js", "/api/health", "/api/process/{technique}",
              "/api/motion-blur", "/motion-blur", "/motion-blur.css",
              "/motion-blur.js",
          }
          missing = required - paths
          assert not missing, f"Missing routes: {sorted(missing)}"
          from backend.main import _motion_kernel, _wiener_restore
          import numpy as np

          for model in ("linear", "uniform", "circular", "non-uniform"):
              kernel = _motion_kernel(model, 9, 0)
              assert np.isclose(kernel.sum(), 1.0), model

          sample = np.full((64, 64, 3), 127, dtype=np.uint8)
          restored = _wiener_restore(sample, _motion_kernel("uniform", 9, 0), 0.008)
          assert restored.shape == sample.shape
          print("Application routes and motion restoration smoke check passed.")
          PY
