name: Application smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import application and verify critical routes
        env:
          DATABASE_URL: sqlite:////tmp/dip-ci.db
          DIP_OUTPUT_DIR: /tmp/dip-ci-output
        run: |
          python - <<'PY'
          from backend.main import app
          paths = {route.path for route in app.routes}
          required = {
              "/", "/login", "/signin", "/offline.html", "/404.html",
              "/service-worker.js", "/api/health", "/api/process/{technique}",
              "/api/auth/signup", "/api/auth/login", "/api/auth/me",
              "/api/auth/logout",
          }
          missing = required - paths
          assert not missing, f"Missing routes: {sorted(missing)}"
          print("Application import and route smoke check passed.")
          PY
