services:
  - type: web
    name: dip-image-compression
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: dip-image-compression-db
          property: connectionString

databases:
  - name: dip-image-compression-db
    databaseName: dip_auth
    user: dip_auth
    plan: free
