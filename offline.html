<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff"><title>You're Offline | DIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#080808}body{font-family:Oswald,Impact,sans-serif}
.offline{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;position:relative;overflow:hidden}
.wire{position:absolute;left:8%;top:0;width:2px;height:190px;background:#171717}.wire:after{content:"";position:absolute;bottom:-12px;left:-9px;width:20px;height:35px;background:#080808;clip-path:polygon(50% 0,100% 20%,100% 84%,50% 100%,0 84%,0 20%)}
.art{width:min(760px,92vw);height:min(66vh,570px);min-height:340px;position:relative;display:grid;place-items:center}
.word{position:absolute;top:5%;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(100px,19vw,230px);line-height:1;color:#ff4148;letter-spacing:.025em;white-space:nowrap;animation:word-reveal .85s cubic-bezier(.2,.8,.2,1) both}
.signal{position:absolute;top:24%;width:min(360px,70vw);height:210px;display:grid;place-items:center}
.signal svg{width:100%;height:100%;overflow:visible;animation:signal-float 4s ease-in-out infinite}
.signal path,.signal circle{fill:none;stroke:#111;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.signal .red{stroke:#ff4148;stroke-width:9;stroke-dasharray:12 17;animation:pulse 1.8s ease-in-out infinite,slash-sweep 2.8s ease-in-out infinite}
.orbit{position:absolute;bottom:17%;width:230px;height:2px;border-top:3px dashed #111}
.caption{text-align:center;margin-top:-10px;animation:caption-rise .8s .3s both}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(44px,7vw,76px);margin:0;line-height:1;text-decoration:line-through;text-decoration-thickness:2px}
p{font-family:Oswald,sans-serif;font-size:16px;color:#555;margin:12px 0 20px}
button{font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;color:#080808;background:none;border:0;cursor:pointer;padding:5px 12px}
button:hover{color:#ff4148;transform:translateY(-2px)}button:focus-visible{outline:2px solid #ff4148;outline-offset:5px}
.status{font-size:12px;color:#888;letter-spacing:.08em;text-transform:uppercase}
@keyframes word-reveal{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes signal-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes caption-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes slash-sweep{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:48}}
@keyframes pulse{0%,100%{opacity:.35;stroke-dashoffset:0}50%{opacity:1;stroke-dashoffset:28}}
@media(max-width:600px){.art{height:52vh;min-height:300px}.word{top:13%;font-size:clamp(90px,24vw,150px)}.signal{top:30%;width:85vw;height:180px}.orbit{bottom:14%}.wire{height:125px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="offline">
<span class="wire" aria-hidden="true"></span>
<section class="art" aria-hidden="true">
<div class="word">OFFLINE</div>
<div class="signal"><svg viewBox="0 0 360 210"><path d="M40 70Q180 -35 320 70"/><path d="M82 112Q180 35 278 112"/><path d="M126 151Q180 108 234 151"/><circle cx="180" cy="188" r="7"/><path class="red" d="M45 25 315 185"/></svg></div>
<div class="orbit"></div>
</section>
<div class="caption"><h1>Connection Lost</h1><p>Looks like your internet connection took a break.</p>
<button type="button" id="retry">Try Again ↗</button><div class="status" id="status" role="status" aria-live="polite">Waiting for connection</div></div>
</main>
<script>
const statusText=document.getElementById('status');
function update(){statusText.textContent=navigator.onLine?'Connection detected — retry when ready':'Waiting for connection';}
window.addEventListener('online',update);window.addEventListener('offline',update);update();
document.getElementById('retry').addEventListener('click',()=>{statusText.textContent='Checking connection…';if(navigator.onLine){location.href='/';}else{statusText.textContent='Still offline. Check your internet and try again.';}});
</script></body></html>
